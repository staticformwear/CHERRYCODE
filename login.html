<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Account - Cherry</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-overlay: rgba(0, 0, 0, 0.6);
            --card-bg: #ffffff;
            --text-color: #000000;
            --text-muted: #666666;
            --border-color: #cccccc;
            --input-border: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0f1015;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* Popup Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 2.5rem 2rem 2rem 2rem;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .close-btn {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: none;
            border: none;
            color: #000000;
            font-size: 1.5rem;
            cursor: pointer;
            text-decoration: none;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .close-btn:hover {
            background-color: #f0f0f0;
        }

        .brand-title {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            margin-bottom: 1.75rem;
            text-align: left;
        }

        .auth-view {
            width: 100%;
            display: none;
            flex-direction: column;
        }

        .auth-view.active {
            display: flex;
        }

        .input-group {
            position: relative;
            width: 100%;
            margin-bottom: 1.25rem;
        }

        .auth-input {
            width: 100%;
            padding: 0.9rem 1rem;
            background: transparent;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            text-align: left;
        }

        .auth-input::placeholder {
            color: var(--text-muted);
        }

        .auth-input:focus {
            border-color: #000000;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            padding: 4px;
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .forgot-password-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            margin-bottom: 1.5rem;
        }

        .divider-line {
            width: 100%;
            height: 1px;
            background-color: rgba(0, 0, 0, 0.15);
            margin-bottom: 1rem;
        }

        .forgot-link {
            background: none;
            border: none;
            color: #000000;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            text-align: left;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Buttons matching requested styles */
        .btn-black {
            width: 100%;
            padding: 0.95rem;
            background-color: #000000;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 0.85rem;
            text-align: center;
        }

        .btn-black:hover {
            background-color: #222222;
        }

        .btn-social {
            width: 100%;
            padding: 0.95rem;
            background: transparent;
            color: #000000;
            border: 1px solid #000000;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 0.85rem;
        }

        .btn-social:hover {
            background-color: #f8f9fa;
        }

        .social-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .switch-auth-mode {
            margin-top: 1.25rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
        }

        .switch-auth-mode button {
            background: none;
            border: none;
            color: #000000;
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .message-banner {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }
        .message-banner.error {
            background-color: rgba(220, 38, 38, 0.1);
            border: 1px solid #dc2626;
            color: #dc2626;
            display: block;
        }
        .message-banner.success {
            background-color: rgba(22, 163, 74, 0.1);
            border: 1px solid #16a34a;
            color: #16a34a;
            display: block;
        }
    </style>
</head>
<body>

    <div class="modal-overlay">
        <div class="auth-container">
            <a href="index.html" class="close-btn">&times;</a>

            <!-- SIGN IN VIEW -->
            <div id="signInView" class="auth-view active">
                <h1 class="brand-title">WELCOME</h1>

                <div id="signInMessage" class="message-banner"></div>

                <form id="signInForm" onsubmit="handleSignIn(event)">
                    <div class="input-group">
                        <input type="email" id="signInEmail" class="auth-input" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="signInPassword" class="auth-input" placeholder="Password" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signInPassword', this)" aria-label="Toggle password visibility">
                            <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>

                    <div class="forgot-password-container">
                        <div class="divider-line"></div>
                        <button type="button" class="forgot-link" onclick="switchView('forgotView')">Forgot your password?</button>
                    </div>

                    <button type="submit" class="btn-black">Sign In</button>
                    
                    <button type="button" class="btn-social" onclick="handleGoogleSignIn()">
                        <img src="IMG_0565.png" alt="Google logo" class="social-icon">
                        Continue with Google
                    </button>

                    <button type="button" class="btn-social" onclick="handleAppleSignIn()">
                        <img src="IMG_0566.png" alt="Apple logo" class="social-icon">
                        Continue with Apple
                    </button>
                </form>

                <div class="switch-auth-mode">
                    Don't have an account? <button onclick="switchView('registerView')">Sign up</button>
                </div>
            </div>

            <!-- FORGOT PASSWORD VIEW -->
            <div id="forgotView" class="auth-view">
                <h1 class="brand-title">Recover Password</h1>

                <div id="forgotMessage" class="message-banner"></div>

                <form id="forgotForm" onsubmit="handleForgotPassword(event)">
                    <div class="input-group">
                        <input type="email" id="forgotEmail" class="auth-input" placeholder="Email address" required>
                    </div>

                    <button type="submit" class="btn-black">Send reset email</button>
                    <button type="button" class="btn-social" style="border: none;" onclick="switchView('signInView')">Cancel</button>
                </form>
            </div>

            <!-- CREATE ACCOUNT VIEW (SIGN UP) -->
            <div id="registerView" class="auth-view">
                <h1 class="brand-title">WELCOME</h1>

                <div id="registerMessage" class="message-banner"></div>

                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="input-group">
                        <input type="text" id="regForename" class="auth-input" placeholder="First name" required>
                    </div>
                    <div class="input-group">
                        <input type="text" id="regSurname" class="auth-input" placeholder="Last name" required>
                    </div>
                    <div class="input-group">
                        <input type="email" id="regEmail" class="auth-input" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="regPassword" class="auth-input" placeholder="Password" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('regPassword', this)" aria-label="Toggle password visibility">
                            <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>

                    <button type="submit" class="btn-black">Sign Up</button>
                </form>

                <div class="switch-auth-mode">
                    Already have an account? <button onclick="switchView('signInView')">Sign In</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.auth-view').forEach(view => view.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            document.querySelectorAll('.message-banner').forEach(b => { b.className = 'message-banner'; b.textContent = ''; });
        }

        function togglePasswordVisibility(inputId, buttonEl) {
            const inputField = document.getElementById(inputId);
            const svgIcon = buttonEl.querySelector('svg');

            if (inputField.type === 'password') {
                inputField.type = 'text';
                svgIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                inputField.type = 'password';
                svgIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }

        function getRegisteredUsers() {
            const users = localStorage.getItem('fountain_users');
            return users ? JSON.parse(users) : [];
        }

        function handleSignIn(event) {
            event.preventDefault();
            const email = document.getElementById('signInEmail').value.trim();
            const password = document.getElementById('signInPassword').value;
            const msgBox = document.getElementById('signInMessage');

            const users = getRegisteredUsers();
            const foundUser = users.find(u => u.email === email && u.password === password);

            if (foundUser) {
                msgBox.className = 'message-banner success';
                msgBox.textContent = `Welcome back, ${foundUser.forename}! Signed in successfully to Cherry.`;
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            } else {
                msgBox.className = 'message-banner error';
                msgBox.textContent = 'Account does not exist.';
            }
        }

        function handleGoogleSignIn() {
            // Integration hook for Google Authentication redirect to Cherry
            alert('Redirecting to Google to continue to Cherry...');
        }

        function handleAppleSignIn() {
            // Integration hook for Apple Authentication redirect to Cherry
            alert('Redirecting to Apple to continue to Cherry...');
        }

        function handleForgotPassword(event) {
            event.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim();
            const msgBox = document.getElementById('forgotMessage');
            if (email) {
                msgBox.className = 'message-banner success';
                msgBox.textContent = `Password reset email sent to ${email}.`;
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            const email = document.getElementById('regEmail').value.trim();
            const forename = document.getElementById('regForename').value.trim();
            const surname = document.getElementById('regSurname').value.trim();
            const password = document.getElementById('regPassword').value;
            const msgBox = document.getElementById('registerMessage');

            let users = getRegisteredUsers();
            if (users.some(u => u.email === email)) {
                msgBox.className = 'message-banner error';
                msgBox.textContent = 'An account with this email already exists.';
                return;
            }

            users.push({ email, forename, surname, password });
            localStorage.setItem('fountain_users', JSON.stringify(users));

            msgBox.className = 'message-banner success';
            msgBox.textContent = 'Account created successfully! Redirecting to login...';
            setTimeout(() => {
                document.getElementById('registerForm').reset();
                switchView('signInView');
            }, 1200);
        }
    </script>
</body>
</html>
