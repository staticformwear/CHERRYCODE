<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Account - Cherry</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-overlay: rgba(0, 0, 0, 0.4);
            --card-bg: #ffffff;
            --text-color: #000000;
            --text-muted: #666666;
            --input-border: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Fully transparent background so homepage is clearly visible underneath */
            background: transparent;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* Popup Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        /* Made wider/more of a horizontal rectangle (max-width increased to 600px) */
        .auth-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: 4px;
            padding: 2.5rem 3rem;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.15);
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.25rem;
            background: none;
            border: none;
            color: #000000;
            font-size: 1.5rem;
            cursor: pointer;
            text-decoration: none;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            opacity: 0.7;
        }

        /* WELCOME title placed above the slider, slightly bigger in size (1.95rem) */
        .brand-title {
            font-size: 1.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            text-align: center;
            line-height: 1.3;
            color: #000000;
        }

        /* Tab Switcher Slider Header moved below Welcome title */
        .auth-tabs {
            display: flex;
            width: 100%;
            margin-bottom: 2rem;
            border-bottom: 1px solid #e0e0e0;
            position: relative;
        }

        .auth-tab {
            flex: 1;
            background: none;
            border: none;
            padding-bottom: 0.75rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            text-align: center;
            position: relative;
            transition: color 0.2s ease;
        }

        .auth-tab.active {
            color: var(--text-color);
        }

        /* Bottom sliding indicator line (faint grey background line removed, only active black indicator/bottom state) */
        .auth-tabs::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 50%;
            height: 2px;
            background-color: #000000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-tabs.register-active::after {
            transform: translateX(100%);
        }

        .auth-view {
            width: 100%;
            display: none;
            flex-direction: column;
        }

        .auth-view.active {
            display: flex;
        }

        .input-group {
            position: relative;
            width: 100%;
            margin-bottom: 1rem;
        }

        /* Input fields with pure black text and no letter spacing on password */
        .auth-input {
            width: 100%;
            padding: 0.8rem 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--input-border);
            color: #000000;
            font-size: 0.95rem;
            outline: none;
            text-align: left;
            font-family: 'Inter', sans-serif;
            letter-spacing: normal;
        }

        .auth-input::placeholder {
            color: #000000;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
        }

        .auth-input:focus {
            border-bottom-color: #000000;
        }

        /* Password input styled exactly like email with no letter spacing */
        .auth-input[type="password"] {
            -webkit-text-security: disc;
            font-family: 'Inter', sans-serif;
            letter-spacing: normal;
        }

        .forgot-password-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            margin-bottom: 1.5rem;
        }

        .divider-line {
            width: 100%;
            height: 1px;
            background-color: rgba(0, 0, 0, 0.15);
            margin-bottom: 0.85rem;
        }

        /* Forgot password underlined and black colored */
        .forgot-link {
            background: none;
            border: none;
            color: #000000;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
            text-align: left;
            font-weight: 500;
        }

        .forgot-link:hover {
            opacity: 0.7;
        }

        /* Solid black action button */
        .btn-black {
            width: 100%;
            padding: 0.9rem;
            background-color: #000000;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 0.75rem;
            text-align: center;
        }

        .btn-black:hover {
            background-color: #222222;
        }

        /* Social Auth Buttons with 50% larger logos (30px instead of 20px) */
        .btn-social {
            width: 100%;
            padding: 0.9rem;
            background: transparent;
            color: #000000;
            border: 1px solid #000000;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 0.75rem;
        }

        .btn-social:hover {
            background-color: #f8f9fa;
        }

        .social-icon {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .message-banner {
            width: 100%;
            padding: 0.75rem;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }
        .message-banner.error {
            background-color: rgba(220, 38, 38, 0.1);
            border: 1px solid #dc2626;
            color: #dc2626;
            display: block;
        }
        .message-banner.success {
            background-color: rgba(22, 163, 74, 0.1);
            border: 1px solid #16a34a;
            color: #16a34a;
            display: block;
        }
    </style>
</head>
<body>

    <div class="modal-overlay">
        <div class="auth-container">
            <a href="index.html" class="close-btn">&times;</a>

            <h1 class="brand-title" id="mainBrandTitle">WELCOME</h1>

            <div id="authTabsHeader" class="auth-tabs">
                <button type="button" id="tabSignIn" class="auth-tab active" onclick="switchView('signInView')">Sign In</button>
                <button type="button" id="tabRegister" class="auth-tab" onclick="switchView('registerView')">Sign Up</button>
            </div>

            <div id="signInView" class="auth-view active">
                <div id="signInMessage" class="message-banner"></div>

                <form id="signInForm" onsubmit="handleSignIn(event)">
                    <div class="input-group">
                        <input type="email" id="signInEmail" class="auth-input" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="signInPassword" class="auth-input" placeholder="Password" required>
                    </div>

                    <div class="forgot-password-container">
                        <div class="divider-line"></div>
                        <button type="button" class="forgot-link" onclick="switchView('forgotView')">Forgot your password?</button>
                    </div>

                    <button type="submit" class="btn-black">Sign In</button>
                    
                    <button type="button" class="btn-social" onclick="handleGoogleSignIn()">
                        <img src="IMG_0565.png" alt="Google logo" class="social-icon">
                        Continue with Google
                    </button>

                    <button type="button" class="btn-social" onclick="handleAppleSignIn()">
                        <img src="IMG_0566.png" alt="Apple logo" class="social-icon">
                        Continue with Apple
                    </button>
                </form>
            </div>

            <div id="forgotView" class="auth-view">
                <div id="forgotMessage" class="message-banner"></div>

                <form id="forgotForm" onsubmit="handleForgotPassword(event)">
                    <div class="input-group">
                        <input type="email" id="forgotEmail" class="auth-input" placeholder="Email address" required>
                    </div>

                    <button type="submit" class="btn-black">Send reset email</button>
                    <button type="button" class="btn-social" style="border: none;" onclick="switchView('signInView')">Cancel</button>
                </form>
            </div>

            <div id="registerView" class="auth-view">
                <div id="registerMessage" class="message-banner"></div>

                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="input-group">
                        <input type="text" id="regForename" class="auth-input" placeholder="First name" required>
                    </div>
                    <div class="input-group">
                        <input type="text" id="regSurname" class="auth-input" placeholder="Last name" required>
                    </div>
                    <div class="input-group">
                        <input type="email" id="regEmail" class="auth-input" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="regPassword" class="auth-input" placeholder="Password" required>
                    </div>

                    <button type="submit" class="btn-black">Sign Up</button>
                </form>
            </div>

        </div>
    </div>

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.auth-view').forEach(view => view.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            document.querySelectorAll('.message-banner').forEach(b => { b.className = 'message-banner'; b.textContent = ''; });

            const tabsHeader = document.getElementById('authTabsHeader');
            const tabSignIn = document.getElementById('tabSignIn');
            const tabRegister = document.getElementById('tabRegister');
            const brandTitle = document.getElementById('mainBrandTitle');

            if (viewId === 'signInView') {
                tabsHeader.style.display = 'flex';
                tabsHeader.classList.remove('register-active');
                tabSignIn.classList.add('active');
                tabRegister.classList.remove('active');
                brandTitle.textContent = 'WELCOME';
                brandTitle.style.display = 'block';
            } else if (viewId === 'registerView') {
                tabsHeader.style.display = 'flex';
                tabsHeader.classList.add('register-active');
                tabSignIn.classList.remove('active');
                tabRegister.classList.add('active');
                brandTitle.textContent = 'WELCOME';
                brandTitle.style.display = 'block';
            } else {
                // Hide tabs for sub-views like Forgot Password
                tabsHeader.style.display = 'none';
                brandTitle.textContent = 'Recover Password';
                brandTitle.style.display = 'block';
            }
        }

        function getRegisteredUsers() {
            const users = localStorage.getItem('fountain_users');
            return users ? JSON.parse(users) : [];
        }

        function handleSignIn(event) {
            event.preventDefault();
            const email = document.getElementById('signInEmail').value.trim();
            const password = document.getElementById('signInPassword').value;
            const msgBox = document.getElementById('signInMessage');

            const users = getRegisteredUsers();
            const foundUser = users.find(u => u.email === email && u.password === password);

            if (foundUser) {
                msgBox.className = 'message-banner success';
                msgBox.textContent = `Welcome back, ${foundUser.forename}! Signed in successfully to Cherry.`;
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            } else {
                msgBox.className = 'message-banner error';
                msgBox.textContent = 'Account does not exist.';
            }
        }

        function handleGoogleSignIn() {
            alert('Redirecting to Google to continue to Cherry...');
        }

        function handleAppleSignIn() {
            alert('Redirecting to Apple to continue to Cherry...');
        }

        function handleForgotPassword(event) {
            event.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim();
            const msgBox = document.getElementById('forgotMessage');
            if (email) {
                msgBox.className = 'message-banner success';
                msgBox.textContent = `Password reset email sent to ${email}.`;
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            const email = document.getElementById('regEmail').value.trim();
            const forename = document.getElementById('regForename').value.trim();
            const surname = document.getElementById('regSurname').value.trim();
            const password = document.getElementById('regPassword').value;
            const msgBox = document.getElementById('registerMessage');

            let users = getRegisteredUsers();
            if (users.some(u => u.email === email)) {
                msgBox.className = 'message-banner error';
                msgBox.textContent = 'An account with this email already exists.';
                return;
            }

            users.push({ email, forename, surname, password });
            localStorage.setItem('fountain_users', JSON.stringify(users));

            msgBox.className = 'message-banner success';
            msgBox.textContent = 'Account created successfully! Redirecting to login...';
            setTimeout(() => {
                document.getElementById('registerForm').reset();
                switchView('signInView');
            }, 1200);
        }
    </script>
</body>
</html>
