<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Account - Fountain</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #1a1c23;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .top-bar {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .back-home {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .back-home:hover, .close-btn:hover {
            color: var(--text-color);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
            text-decoration: none;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .brand-title {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }

        .brand-subtitle {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
        }

        .auth-view {
            width: 100%;
            display: none;
            flex-direction: column;
        }

        .auth-view.active {
            display: flex;
        }

        .input-group {
            position: relative;
            width: 100%;
            margin-bottom: 1.25rem;
        }

        .auth-input {
            width: 100%;
            padding: 0.9rem 1rem;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            text-align: left;
        }

        .auth-input::placeholder {
            color: var(--text-muted);
        }

        .auth-input:focus {
            border-color: #ffffff;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            padding: 4px;
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .forgot-password-container {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 2rem;
        }

        .forgot-link {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
        }

        .forgot-link:hover {
            color: var(--text-color);
        }

        .btn-white {
            width: 100%;
            padding: 0.95rem;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 0.85rem;
            text-align: center;
        }

        .btn-white:hover {
            background-color: #e2e8f0;
        }

        .btn-outline {
            width: 100%;
            padding: 0.95rem;
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .btn-outline:hover {
            border-color: var(--text-color);
        }

        .membership-card-preview {
            width: 100%;
            height: 140px;
            background: linear-gradient(135deg, #2a2d39 0%, #15171e 100%);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .membership-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .membership-emblem {
            font-size: 2.2rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.15);
            position: absolute;
            right: 1.5rem;
            bottom: 0.5rem;
        }

        .step-indicator {
            text-align: left;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .terms-row {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .terms-row input[type="checkbox"] {
            margin-top: 3px;
            accent-color: #ffffff;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .terms-row label {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
            cursor: pointer;
        }

        .terms-row label strong {
            color: var(--text-color);
        }

        .switch-auth-mode {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .switch-auth-mode button {
            background: none;
            border: none;
            color: var(--text-color);
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .message-banner {
            width: 100%;
            padding: 0.75rem;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }
        .message-banner.error {
            background-color: rgba(220, 38, 38, 0.2);
            border: 1px solid #dc2626;
            color: #fca5a5;
            display: block;
        }
        .message-banner.success {
            background-color: rgba(22, 163, 74, 0.2);
            border: 1px solid #16a34a;
            color: #86efac;
            display: block;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-home">&larr; Home</a>
        <a href="index.html" class="close-btn">&times;</a>
    </div>

    <div class="auth-container">

        <!-- SIGN IN VIEW -->
        <div id="signInView" class="auth-view active">
            <h1 class="brand-title">FOUNTAIN</h1>
            <div class="brand-subtitle">PRESTIGE</div>

            <div id="signInMessage" class="message-banner"></div>

            <form id="signInForm" onsubmit="handleSignIn(event)">
                <div class="input-group">
                    <input type="email" id="signInEmail" class="auth-input" placeholder="Your email address" required>
                </div>
                <div class="input-group">
                    <input type="password" id="signInPassword" class="auth-input" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signInPassword', this)" aria-label="Toggle password visibility">
                        <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>

                <div class="forgot-password-container">
                    <button type="button" class="forgot-link" onclick="switchView('forgotView')">Forgot your password?</button>
                </div>

                <button type="submit" class="btn-outline">Sign in</button>
                <button type="button" class="btn-outline" style="margin-top: 0.85rem;" onclick="switchView('registerView')">Create an account</button>
            </form>
        </div>

        <!-- FORGOT PASSWORD VIEW -->
        <div id="forgotView" class="auth-view">
            <h1 class="brand-title" style="font-size: 1.85rem; font-weight: 400; font-family: serif;">Recover your</h1>
            <h1 class="brand-title" style="font-size: 2.2rem; margin-bottom: 2.5rem;">Password</h1>

            <div id="forgotMessage" class="message-banner"></div>

            <form id="forgotForm" onsubmit="handleForgotPassword(event)">
                <div class="input-group">
                    <input type="email" id="forgotEmail" class="auth-input" placeholder="Your email address" required>
                </div>

                <button type="submit" class="btn-white">Send reset email</button>
                <button type="button" class="btn-outline" onclick="switchView('signInView')">Cancel</button>
            </form>
        </div>

        <!-- CREATE ACCOUNT VIEW -->
        <div id="registerView" class="auth-view">
            <div class="membership-card-preview">
                <div class="membership-card-header">
                    <span>Member</span>
                    <span>FOUNTAIN</span>
                </div>
                <div class="membership-emblem">F</div>
            </div>

            <div class="step-indicator">1 / 2 &nbsp; Details</div>

            <div id="registerMessage" class="message-banner"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <input type="email" id="regEmail" class="auth-input" placeholder="Your email address" required>
                </div>
                <div class="input-group">
                    <input type="text" id="regForename" class="auth-input" placeholder="First name" required>
                </div>
                <div class="input-group">
                    <input type="text" id="regSurname" class="auth-input" placeholder="Last name" required>
                </div>
                <div class="input-group">
                    <input type="password" id="regPassword" class="auth-input" placeholder="Choose password" required>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('regPassword', this)" aria-label="Toggle password visibility">
                        <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>

                <div class="terms-row">
                    <input type="checkbox" id="termsCheck" required>
                    <label for="termsCheck">Please tick here if you <strong>DO NOT</strong> want us to use your personal data to email you about product launches, news, and promotional offers.</label>
                </div>

                <button type="submit" class="btn-white">Create Account</button>
            </form>

            <div class="switch-auth-mode">
                Already got an account? <button onclick="switchView('signInView')">Login here</button>
            </div>
        </div>

    </div>

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.auth-view').forEach(view => view.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            document.querySelectorAll('.message-banner').forEach(b => { b.className = 'message-banner'; b.textContent = ''; });
        }

        function togglePasswordVisibility(inputId, buttonEl) {
            const inputField = document.getElementById(inputId);
            const svgIcon = buttonEl.querySelector('svg');

            if (inputField.type === 'password') {
                inputField.type = 'text';
                svgIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                inputField.type = 'password';
                svgIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }

        function getRegisteredUsers() {
            const users = localStorage.getItem('fountain_users');
            return users ? JSON.parse(users) : [];
        }

        function handleSignIn(event) {
            event.preventDefault();
            const email = document.getElementById('signInEmail').value.trim();
            const password = document.getElementById('signInPassword').value;
            const msgBox = document.getElementById('signInMessage');

            const users = getRegisteredUsers();
            const foundUser = users.find(u => u.email === email && u.password === password);

            if (foundUser) {
                msgBox.className = 'message-banner success';
                msgBox.textContent = `Welcome back, ${foundUser.forename}! Signed in successfully.`;
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            } else {
                msgBox.className = 'message-banner error';
                msgBox.textContent = 'Account does not exist.';
            }
        }

        function handleForgotPassword(event) {
            event.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim();
            const msgBox = document.getElementById('forgotMessage');
            if (email) {
                msgBox.className = 'message-banner success';
                msgBox.textContent = `Password reset email sent to ${email}.`;
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            const email = document.getElementById('regEmail').value.trim();
            const forename = document.getElementById('regForename').value.trim();
            const surname = document.getElementById('regSurname').value.trim();
            const password = document.getElementById('regPassword').value;
            const msgBox = document.getElementById('registerMessage');

            let users = getRegisteredUsers();
            if (users.some(u => u.email === email)) {
                msgBox.className = 'message-banner error';
                msgBox.textContent = 'An account with this email already exists.';
                return;
            }

            users.push({ email, forename, surname, password });
            localStorage.setItem('fountain_users', JSON.stringify(users));

            msgBox.className = 'message-banner success';
            msgBox.textContent = 'Account created successfully! Redirecting to login...';
            setTimeout(() => {
                document.getElementById('registerForm').reset();
                switchView('signInView');
            }, 1200);
        }
    </script>
</body>
</html>
